name: RepoGuard repair
description: Prepare one validated repair on the dedicated persistent RepoGuard runner.

inputs:
  pr-number:
    description: Exact pull request number.
    required: true
  base-sha:
    description: Exact 40-hex pull request base commit.
    required: true
  head-sha:
    description: Exact 40-hex pull request head commit.
    required: true
  repair-profile:
    description: Named owner-reviewed repair policy.
    required: true
  target-ids:
    description: Canonical JSON array of exact repair target IDs.
    required: true
  allowed-paths:
    description: Canonical JSON array of allowed repository paths.
    required: true

outputs:
  proposal-path:
    description: Path to the single canonical proposal.json.
    value: ${{ steps.prepare.outputs.proposal-path }}
  proposal-sha256:
    description: Domain-separated GitHub proposal identity.
    value: ${{ steps.prepare.outputs.proposal-sha256 }}
  artifact-id:
    description: GitHub artifact ID returned by upload-artifact.
    value: ${{ steps.upload.outputs.artifact-id }}
  artifact-digest:
    description: GitHub artifact digest returned by upload-artifact.
    value: ${{ steps.upload.outputs.artifact-digest }}
  candidate-id:
    description: Exact M5 candidate identity.
    value: ${{ steps.prepare.outputs.candidate-id }}
  validation-sha256:
    description: Exact M5 validation identity.
    value: ${{ steps.prepare.outputs.validation-sha256 }}
  commit-oid:
    description: Exact fixed repair commit OID.
    value: ${{ steps.prepare.outputs.commit-oid }}
  state:
    description: Stable repair state.
    value: ${{ steps.prepare.outputs.state }}

runs:
  using: composite
  steps:
    - name: Authenticate persistent runner Python capability
      id: runner
      shell: bash
      env:
        REPOGUARD_ACTION_REF: ${{ github.action_ref }}
        REPOGUARD_ACTION_REPOSITORY: ${{ github.action_repository }}
        REPOGUARD_ACTION_SOURCE_ROOT: ${{ env.REPOGUARD_ACTION_SOURCE_ROOT }}
        REPOGUARD_HOST_PROFILE: ${{ env.REPOGUARD_HOST_PROFILE }}
        REPOGUARD_PYTHON: ${{ env.REPOGUARD_PYTHON }}
        REPOGUARD_RUN_ATTEMPT: ${{ github.run_attempt }}
        REPOGUARD_RUNNER_LABELS: ${{ env.REPOGUARD_RUNNER_LABELS }}
        REPOGUARD_WORKSPACE: ${{ github.workspace }}
      run: |
        exec /usr/bin/python3 -I "${GITHUB_ACTION_PATH}/../../scripts/m6_action.py" runner-preflight

    - name: Validate context and prepare repair proposal
      id: prepare
      shell: bash
      env:
        REPOGUARD_ACTION_COMMAND: repair
        REPOGUARD_ACTION_DRIVER: ${{ steps.runner.outputs.driver-path }}
        REPOGUARD_ACTION_REF: ${{ github.action_ref }}
        REPOGUARD_ACTION_REPOSITORY: ${{ github.action_repository }}
        REPOGUARD_ACTION_SOURCE_ROOT: ${{ env.REPOGUARD_ACTION_SOURCE_ROOT }}
        REPOGUARD_ACTOR: ${{ github.actor }}
        REPOGUARD_ALLOWED_PATHS: ${{ inputs.allowed-paths }}
        REPOGUARD_BASE_SHA: ${{ inputs.base-sha }}
        REPOGUARD_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        REPOGUARD_EVENT_NAME: ${{ github.event_name }}
        REPOGUARD_EVENT_PATH: ${{ github.event_path }}
        REPOGUARD_HEAD_SHA: ${{ inputs.head-sha }}
        REPOGUARD_HOST_PROFILE: ${{ env.REPOGUARD_HOST_PROFILE }}
        REPOGUARD_PR_NUMBER: ${{ inputs.pr-number }}
        REPOGUARD_REF: ${{ github.ref }}
        REPOGUARD_REPAIR_PROFILE: ${{ inputs.repair-profile }}
        REPOGUARD_REPOSITORY_ALIAS: ${{ env.REPOGUARD_REPOSITORY_ALIAS }}
        REPOGUARD_REPOSITORY_FULL_NAME: ${{ github.repository }}
        REPOGUARD_REPOSITORY_ID: ${{ github.repository_id }}
        REPOGUARD_RUN_ATTEMPT: ${{ github.run_attempt }}
        REPOGUARD_RUN_ID: ${{ github.run_id }}
        REPOGUARD_RUNNER_LABELS: ${{ env.REPOGUARD_RUNNER_LABELS }}
        REPOGUARD_TARGET_IDS: ${{ inputs.target-ids }}
        REPOGUARD_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        REPOGUARD_WORKSPACE: ${{ github.workspace }}
        REPOGUARD_PYTHON: ${{ steps.runner.outputs.python-path }}
      run: |
        exec "$REPOGUARD_PYTHON" -I "$REPOGUARD_ACTION_DRIVER" repair

    - name: Upload exact repair proposal
      id: upload
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: repoguard-proposal-v1-${{ steps.prepare.outputs.proposal-sha256 }}
        path: ${{ steps.prepare.outputs.proposal-path }}
        if-no-files-found: error
        retention-days: "1"
        compression-level: "0"
        overwrite: "false"
        include-hidden-files: "false"
