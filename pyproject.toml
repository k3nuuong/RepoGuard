[build-system]
requires = ["uv_build==0.9.2"]
build-backend = "uv_build"

[project]
name = "repoguard"
version = "0.1.0"
description = "Evidence-driven Python pull-request review and security remediation agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.2,<0.121.0",
    "faiss-cpu>=1.14.3,<2",
    "fastembed-gpu>=0.8.0,<0.9.0",
    "huggingface-hub>=1.25.1,<2",
    "langgraph>=1.2.10,<2",
    "mcp==2.0.0",
    "numpy>=2.5.1,<3",
    "onnxruntime-gpu<1.28",
    "openai>=2.49.0,<3",
    "tokenizers>=0.23.1,<1",
]

[project.scripts]
repoguard = "repoguard.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.163.0",
    "mypy",
    "pytest",
    "pytest-cov",
    "pytest-socket>=0.8.0",
    "ruff",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.uv.build-backend]
source-include = ["scripts/manage-repair-image.sh"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --disable-socket"
testpaths = ["tests"]

[tool.coverage.run]
source = ["repoguard"]

[tool.coverage.report]
fail_under = 90
show_missing = true
