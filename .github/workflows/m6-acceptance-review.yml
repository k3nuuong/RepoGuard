name: M6 acceptance review

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact same-repository pull request number.
        required: true
        type: string
      base_sha:
        description: Exact 40-hex pull request base commit.
        required: true
        type: string
      head_sha:
        description: Exact 40-hex pull request head commit.
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: m6-review-${{ github.repository_id }}-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  deterministic-review:
    if: >-
      ${{
        github.repository == 'k3nuuong/RepoGuard' &&
        (
          github.event_name == 'pull_request' ||
          (
            github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/main' &&
            github.actor == 'k3nuuong' &&
            github.triggering_actor == 'k3nuuong'
          )
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REPOGUARD_HOST_PROFILE: ${{ github.workspace }}/.repoguard-m6-hosted-${{ github.run_id }}-${{ github.run_attempt }}/profile.json
      REPOGUARD_REPOSITORY_ALIAS: acceptance
      REPOGUARD_REVIEW_REPOSITORY: ${{ github.workspace }}/reviewed-repository
      REPOGUARD_TRUSTED_SOURCE: ${{ github.workspace }}/trusted-source
    steps:
      - name: Check out pull request merge
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          fetch-depth: "0"
          fetch-tags: false
          lfs: false
          path: reviewed-repository
          persist-credentials: false
          set-safe-directory: false
          show-progress: false
          submodules: false

      - name: Check out exact dispatched head
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          fetch-depth: "0"
          fetch-tags: false
          lfs: false
          path: reviewed-repository
          persist-credentials: false
          ref: ${{ inputs.head_sha }}
          set-safe-directory: false
          show-progress: false
          submodules: false

      - name: Check out trusted M6 source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          fetch-depth: "1"
          fetch-tags: false
          lfs: false
          path: trusted-source
          persist-credentials: false
          ref: f71d620de1a66566a414c483c0879f9dd1a37fa4
          repository: k3nuuong/RepoGuard
          set-safe-directory: false
          show-progress: false
          submodules: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install the frozen trusted M6 package
        shell: bash
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/repoguard-m6-venv
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-deps "uv==0.9.2"
          uv sync \
            --frozen \
            --no-dev \
            --no-editable \
            --project "$REPOGUARD_TRUSTED_SOURCE"
          printf '%s\n' "$UV_PROJECT_ENVIRONMENT/bin" >> "$GITHUB_PATH"

      - name: Prepare owner-only hosted review profile
        shell: bash
        env:
          REPOGUARD_PROFILE_REPOSITORY_FULL_NAME: ${{ github.repository }}
          REPOGUARD_PROFILE_REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -I - <<'PY'
          import json
          import os
          import socket
          from pathlib import Path

          os.umask(0o077)
          profile_path = Path(os.environ["REPOGUARD_HOST_PROFILE"])
          profile_root = profile_path.parent
          profile_root.mkdir(mode=0o700)
          profile_root.chmod(0o700)
          product_state = profile_root / "product-state"
          repair_state = profile_root / "repair-state"
          product_state.mkdir(mode=0o700)
          repair_state.mkdir(mode=0o700)
          product_state.chmod(0o700)
          repair_state.chmod(0o700)
          socket_path = profile_root / "unused-hosted-review.sock"
          with socket.socket(socket.AF_UNIX, socket.SOCK_STREAM) as listener:
              listener.bind(str(socket_path))

          profile = {
              "schema_version": 1,
              "repositories": [{
                  "alias": "acceptance",
                  "path": os.environ["REPOGUARD_REVIEW_REPOSITORY"],
                  "github_repository_id": int(
                      os.environ["REPOGUARD_PROFILE_REPOSITORY_ID"]
                  ),
                  "github_full_name": os.environ[
                      "REPOGUARD_PROFILE_REPOSITORY_FULL_NAME"
                  ],
              }],
              "git_executable": "/usr/bin/git",
              "docker_executable": "/usr/bin/docker",
              "rootless_socket": str(socket_path),
              "product_state_root": str(product_state),
              "repair_state_root": str(repair_state),
              "runner_labels": [],
              "m4_caches": [],
              "review_profiles": [{
                  "name": "deterministic",
                  "mode": "deterministic",
                  "provider": "none",
                  "model": None,
                  "cache": None,
                  "device": "cpu",
                  "fail_on": "high",
              }],
              "repair_profiles": [],
              "github_actions": {
                  "action_repository": "k3nuuong/RepoGuard",
                  "action_sha": (
                      "f71d620de1a66566a414c483c0879f9dd1a37fa4"
                  ),
                  "publisher": None,
              },
              "mcp": {
                  "publish_check": False,
                  "publish_repair": False,
              },
          }
          payload = json.dumps(
              profile,
              allow_nan=False,
              ensure_ascii=False,
              separators=(",", ":"),
              sort_keys=True,
          ).encode("utf-8")
          path = profile_path
          descriptor = os.open(
              path,
              os.O_CLOEXEC
              | os.O_CREAT
              | os.O_EXCL
              | os.O_WRONLY
              | getattr(os, "O_NOFOLLOW", 0),
              0o600,
          )
          try:
              written = os.write(descriptor, payload)
              if written != len(payload):
                  raise RuntimeError("short profile write")
              os.fsync(descriptor)
          finally:
              os.close(descriptor)
          PY
          python3 -I -m repoguard \
            --profile "$REPOGUARD_HOST_PROFILE" \
            --repository "$REPOGUARD_REPOSITORY_ALIAS" \
            profile validate \
            > /dev/null

      - name: Run exact deterministic review
        id: review
        uses: k3nuuong/RepoGuard@f71d620de1a66566a414c483c0879f9dd1a37fa4
        env:
          REPOGUARD_ANTHROPIC_API_KEY: ""
          REPOGUARD_GITHUB_TOKEN: ${{ github.token }}
          REPOGUARD_OPENAI_API_KEY: ""
        with:
          base-sha: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          cache-dir: ""
          device: cpu
          fail-on: high
          head-sha: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
          mode: deterministic
          model: ""
          pr-number: ${{ github.event.pull_request.number || inputs.pr_number }}
          provider: none
          repository-path: reviewed-repository

      - name: Record stable product failure diagnostics
        if: >-
          ${{
            failure() &&
            steps.review.outcome == 'failure' &&
            steps.review.outputs.result-sha256 == ''
          }}
        shell: bash
        env:
          REPOGUARD_DIAGNOSTIC_BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          REPOGUARD_DIAGNOSTIC_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
          REPOGUARD_DIAGNOSTIC_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPOGUARD_ANTHROPIC_API_KEY: ""
          REPOGUARD_GITHUB_TOKEN: ${{ github.token }}
          REPOGUARD_OPENAI_API_KEY: ""
        run: |
          set -euo pipefail
          umask 077
          diagnostic_root="$(
            mktemp -d -p "$RUNNER_TEMP" repoguard-m6-diagnostic.XXXXXXXX
          )"
          diagnostic_output="$diagnostic_root/envelope.json"
          diagnostic_stderr="$diagnostic_root/stderr"
          set +e
          python3 -I -m repoguard \
            --profile "$REPOGUARD_HOST_PROFILE" \
            --repository "$REPOGUARD_REPOSITORY_ALIAS" \
            review run \
            --base-ref "$REPOGUARD_DIAGNOSTIC_BASE_SHA" \
            --head-ref "$REPOGUARD_DIAGNOSTIC_HEAD_SHA" \
            --review-profile deterministic \
            --github-pr "$REPOGUARD_DIAGNOSTIC_PR_NUMBER" \
            > "$diagnostic_output" \
            2> "$diagnostic_stderr"
          diagnostic_status="$?"
          set -e
          export REPOGUARD_DIAGNOSTIC_OUTPUT="$diagnostic_output"
          export REPOGUARD_DIAGNOSTIC_STATUS="$diagnostic_status"
          export REPOGUARD_DIAGNOSTIC_STDERR="$diagnostic_stderr"
          /usr/bin/python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          output_path = Path(os.environ["REPOGUARD_DIAGNOSTIC_OUTPUT"])
          stderr_path = Path(os.environ["REPOGUARD_DIAGNOSTIC_STDERR"])
          status = int(os.environ["REPOGUARD_DIAGNOSTIC_STATUS"])
          safe = {
              "exit_status": status,
              "stderr_empty": stderr_path.stat().st_size == 0,
          }
          try:
              raw = output_path.read_bytes()
              if not 2 <= len(raw) <= 4 * 1024 * 1024 + 4097:
                  raise ValueError
              envelope = json.loads(raw)
              if type(envelope) is not dict:
                  raise ValueError
              safe["operation"] = envelope.get("operation")
              safe["ok"] = envelope.get("ok")
              if envelope.get("ok") is False:
                  error = envelope.get("error")
                  if type(error) is not dict:
                      raise ValueError
                  for name in (
                      "domain",
                      "code",
                      "retryable",
                      "stage",
                      "attempt_count",
                  ):
                      safe[name] = error.get(name)
              elif envelope.get("ok") is True:
                  result = envelope.get("result")
                  if type(result) is not dict:
                      raise ValueError
                  for name in (
                      "review_sha256",
                      "finding_count",
                      "github_write_supported",
                  ):
                      safe[name] = result.get(name)
          except (OSError, TypeError, ValueError, json.JSONDecodeError):
              safe["diagnostic"] = "invalid_product_output"
          print(
              json.dumps(
                  safe,
                  allow_nan=False,
                  ensure_ascii=True,
                  separators=(",", ":"),
                  sort_keys=True,
              )
          )
          PY
          python3 -I - <<'PY'
          import http.client
          import json
          import os
          import socket
          import ssl

          probe = {
              "environment": {
                  name: bool(os.environ.get(name))
                  for name in (
                      "HTTPS_PROXY",
                      "NO_PROXY",
                      "SSL_CERT_DIR",
                      "SSL_CERT_FILE",
                  )
              }
          }
          try:
              addresses = socket.getaddrinfo(
                  "api.github.com",
                  443,
                  type=socket.SOCK_STREAM,
              )
              probe["dns"] = {
                  "address_count": len(addresses),
                  "families": sorted({item[0] for item in addresses}),
              }
          except Exception as error:
              probe["dns"] = {"error_type": type(error).__name__}

          connection = None
          stage = "tls_context"
          try:
              context = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
              context.minimum_version = ssl.TLSVersion.TLSv1_2
              context.verify_mode = ssl.CERT_REQUIRED
              context.check_hostname = True
              context.load_default_certs(ssl.Purpose.SERVER_AUTH)
              stage = "connect"
              connection = http.client.HTTPSConnection(
                  "api.github.com",
                  443,
                  timeout=5.0,
                  context=context,
              )
              connection.connect()
              stage = "request"
              connection.putrequest(
                  "GET",
                  "/rate_limit",
                  skip_host=True,
                  skip_accept_encoding=True,
              )
              connection.putheader("Accept", "application/vnd.github+json")
              connection.putheader(
                  "Authorization",
                  f"Bearer {os.environ['REPOGUARD_GITHUB_TOKEN']}",
              )
              connection.putheader("Connection", "close")
              connection.putheader("Host", "api.github.com")
              connection.putheader("User-Agent", "RepoGuard-M6-Diagnostic")
              connection.putheader("X-GitHub-Api-Version", "2022-11-28")
              connection.endheaders()
              response = connection.getresponse()
              content = response.read(65_537)
              probe["https"] = {
                  "body_bytes": len(content),
                  "header_count": len(response.getheaders()),
                  "status": response.status,
              }
          except Exception as error:
              failure = {
                  "error_type": type(error).__name__,
                  "stage": stage,
              }
              error_number = getattr(error, "errno", None)
              verify_code = getattr(error, "verify_code", None)
              if type(error_number) is int:
                  failure["errno"] = error_number
              if type(verify_code) is int:
                  failure["verify_code"] = verify_code
              probe["https"] = failure
          finally:
              if connection is not None:
                  connection.close()

          print(
              json.dumps(
                  probe,
                  allow_nan=False,
                  ensure_ascii=True,
                  separators=(",", ":"),
                  sort_keys=True,
              )
          )
          PY

      - name: Record exact review coordinates
        if: ${{ always() }}
        shell: bash
        env:
          REPOGUARD_ARTIFACT_DIGEST: ${{ steps.review.outputs.artifact-digest }}
          REPOGUARD_ARTIFACT_ID: ${{ steps.review.outputs.artifact-id }}
          REPOGUARD_CONCLUSION: ${{ steps.review.outputs.conclusion }}
          REPOGUARD_EVIDENCE_SHA256: ${{ steps.review.outputs.evidence-sha256 }}
          REPOGUARD_FINDING_COUNT: ${{ steps.review.outputs.finding-count }}
          REPOGUARD_PROPOSAL_SHA256: ${{ steps.review.outputs.proposal-sha256 }}
          REPOGUARD_RESULT_SHA256: ${{ steps.review.outputs.result-sha256 }}
          REPOGUARD_REVIEW_SHA256: ${{ steps.review.outputs.review-sha256 }}
        run: |
          {
            printf '\n## M6 acceptance coordinates\n\n'
            printf -- '- source run: `%s`\n' "$GITHUB_RUN_ID"
            printf -- '- source attempt: `%s`\n' "$GITHUB_RUN_ATTEMPT"
            printf -- '- result SHA-256: `%s`\n' "$REPOGUARD_RESULT_SHA256"
            printf -- '- evidence SHA-256: `%s`\n' "$REPOGUARD_EVIDENCE_SHA256"
            printf -- '- deterministic review SHA-256: `%s`\n' "$REPOGUARD_REVIEW_SHA256"
            printf -- '- proposal SHA-256: `%s`\n' "$REPOGUARD_PROPOSAL_SHA256"
            printf -- '- artifact ID: `%s`\n' "$REPOGUARD_ARTIFACT_ID"
            printf -- '- artifact digest: `%s`\n' "$REPOGUARD_ARTIFACT_DIGEST"
            printf -- '- finding count: `%s`\n' "$REPOGUARD_FINDING_COUNT"
            printf -- '- conclusion: `%s`\n' "$REPOGUARD_CONCLUSION"
          } >> "$GITHUB_STEP_SUMMARY"
