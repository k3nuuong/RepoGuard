name: M6 acceptance repair

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact same-repository pull request number.
        required: true
        type: string
      base_sha:
        description: Exact 40-hex pull request base commit.
        required: true
        type: string
      head_sha:
        description: Exact 40-hex pull request head commit.
        required: true
        type: string
      repair_profile:
        description: Exact owner-reviewed repair profile name.
        required: true
        type: string
      target_ids:
        description: Canonical sorted JSON array of exact repair target IDs.
        required: true
        type: string
      allowed_paths:
        description: Canonical sorted JSON array of allowed repository paths.
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: m6-publisher-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  deterministic-repair:
    if: >-
      ${{
        github.repository == 'k3nuuong/RepoGuard' &&
        github.ref == 'refs/heads/main' &&
        github.actor == 'k3nuuong' &&
        github.triggering_actor == 'k3nuuong'
      }}
    runs-on:
      - self-hosted
      - Linux
      - X64
      - repoguard-publisher
    timeout-minutes: 30
    env:
      REPOGUARD_ACTION_SOURCE_ROOT: ${{ vars.REPOGUARD_ACTION_SOURCE_ROOT }}
      REPOGUARD_HOST_PROFILE: ${{ vars.REPOGUARD_HOST_PROFILE }}
      REPOGUARD_PYTHON: ${{ vars.REPOGUARD_PYTHON }}
      REPOGUARD_REPOSITORY_ALIAS: acceptance
      REPOGUARD_RUNNER_LABELS: '["Linux","X64","repoguard-publisher","self-hosted"]'
      DOCKER_HOST: ""
    steps:
      - name: Check out exact repair head without credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          clean: true
          fetch-depth: "0"
          fetch-tags: false
          lfs: false
          path: reviewed-repository
          persist-credentials: false
          ref: ${{ inputs.head_sha }}
          repository: k3nuuong/RepoGuard
          set-safe-directory: false
          show-progress: false
          submodules: false

      - name: Prepare exact deterministic repair
        id: repair
        uses: k3nuuong/RepoGuard/actions/repair@f97e2f13a61ce1d9a9a17a8c6a376006ceed31a3
        env:
          REPOGUARD_ANTHROPIC_API_KEY: ""
          REPOGUARD_GITHUB_TOKEN: ${{ github.token }}
          REPOGUARD_OPENAI_API_KEY: ""
        with:
          allowed-paths: ${{ inputs.allowed_paths }}
          base-sha: ${{ inputs.base_sha }}
          head-sha: ${{ inputs.head_sha }}
          pr-number: ${{ inputs.pr_number }}
          repair-profile: ${{ inputs.repair_profile }}
          target-ids: ${{ inputs.target_ids }}

      - name: Record exact repair coordinates
        if: ${{ always() }}
        shell: bash
        env:
          REPOGUARD_ARTIFACT_DIGEST: ${{ steps.repair.outputs.artifact-digest }}
          REPOGUARD_ARTIFACT_ID: ${{ steps.repair.outputs.artifact-id }}
          REPOGUARD_CANDIDATE_ID: ${{ steps.repair.outputs.candidate-id }}
          REPOGUARD_COMMIT_OID: ${{ steps.repair.outputs.commit-oid }}
          REPOGUARD_PROPOSAL_SHA256: ${{ steps.repair.outputs.proposal-sha256 }}
          REPOGUARD_STATE: ${{ steps.repair.outputs.state }}
          REPOGUARD_VALIDATION_SHA256: ${{ steps.repair.outputs.validation-sha256 }}
        run: |
          {
            printf '\n## M6 repair coordinates\n\n'
            printf -- '- source run: `%s`\n' "$GITHUB_RUN_ID"
            printf -- '- source attempt: `%s`\n' "$GITHUB_RUN_ATTEMPT"
            printf -- '- proposal SHA-256: `%s`\n' "$REPOGUARD_PROPOSAL_SHA256"
            printf -- '- artifact ID: `%s`\n' "$REPOGUARD_ARTIFACT_ID"
            printf -- '- artifact digest: `%s`\n' "$REPOGUARD_ARTIFACT_DIGEST"
            printf -- '- candidate ID: `%s`\n' "$REPOGUARD_CANDIDATE_ID"
            printf -- '- validation SHA-256: `%s`\n' "$REPOGUARD_VALIDATION_SHA256"
            printf -- '- repair commit: `%s`\n' "$REPOGUARD_COMMIT_OID"
            printf -- '- state: `%s`\n' "$REPOGUARD_STATE"
          } >> "$GITHUB_STEP_SUMMARY"
